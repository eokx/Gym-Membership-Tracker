
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membership Plans</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fa;
            padding: 30px;
            color: #202938;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            overflow-x: auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #172033;
            color: white;
        }

        a {
            display: inline-block;
            margin-bottom: 20px;
            color: #15803d;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <a href="/">← Back to Dashboard</a>

    <div class="container">
        <h1>Membership Plans</h1>
        <p>Available gym membership plans</p>

        <table>
            <thead>
                <tr>
                    <th>Plan ID</th>
                    <th>Plan Name</th>
                    <th>Duration</th>
                    <th>Price</th>
                    <th>Description</th>
                </tr>
            </thead>

            <tbody>
                {% for plan in plans %}
                <tr>
                    <td>{{ plan.plan_id }}</td>
                    <td>{{ plan.plan_name }}</td>
                    <td>{{ plan.duration_months }} Months</td>
                    <td>₹{{ plan.price }}</td>
                    <td>{{ plan.description }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
